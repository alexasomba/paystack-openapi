type: object
properties:
  event:
    type: string
    description: The type of event that occurred.
  data:
    type: object
    description: The payload of the event.
oneOf:
  - type: object
    properties:
      event:
        type: string
        enum: [charge.success]
      data:
        $ref: "./TransactionFetchResponse.yaml#/properties/data"
    required: [event, data]

  - type: object
    properties:
      event:
        type: string
        enum: [transfer.success]
      data:
        $ref: "./TransferFetchResponse.yaml#/properties/data"
    required: [event, data]

  - type: object
    properties:
      event:
        type: string
        enum: [transfer.failed]
      data:
        $ref: "./TransferFetchResponse.yaml#/properties/data"
    required: [event, data]

  - type: object
    properties:
      event:
        type: string
        enum: [transfer.reversed]
      data:
        $ref: "./TransferFetchResponse.yaml#/properties/data"
    required: [event, data]

  - type: object
    properties:
      event:
        type: string
        enum: [subscription.create]
      data:
        $ref: "./SubscriptionFetchResponse.yaml#/properties/data"
    required: [event, data]

  - type: object
    properties:
      event:
        type: string
        enum: [subscription.disable]
      data:
        $ref: "./SubscriptionFetchResponse.yaml#/properties/data"
    required: [event, data]

  - type: object
    properties:
      event:
        type: string
        enum: [subscription.not_renew]
      data:
        $ref: "./SubscriptionFetchResponse.yaml#/properties/data"
    required: [event, data]

  - type: object
    properties:
      event:
        type: string
        enum: [invoice.create]
      data:
        $ref: "./PaymentRequestVerifyResponse.yaml#/properties/data"
    required: [event, data]

  - type: object
    properties:
      event:
        type: string
        enum: [invoice.update]
      data:
        $ref: "./PaymentRequestVerifyResponse.yaml#/properties/data"
    required: [event, data]

  - type: object
    properties:
      event:
        type: string
        enum: [invoice.payment_failed]
      data:
        type: object
        description: The invoice payment failure payload. Inspect status and invoice details before changing access.
        additionalProperties: true
    required: [event, data]

  - type: object
    properties:
      event:
        type: string
        enum: [charge.dispute.remind]
      data:
        $ref: "./DisputeFetchResponse.yaml#/properties/data"
    required: [event, data]

  - type: object
    properties:
      event:
        type: string
        enum: [refund.pending, refund.processing, refund.needs-attention]
      data:
        type: object
        description: Refund lifecycle details. Payload fields vary with processor and refund state.
        additionalProperties: true
    required: [event, data]

  - type: object
    properties:
      event:
        type: string
        enum: [customeridentification.success, customeridentification.failed]
      data:
        type: object
        description: Customer identification result and verification details.
        additionalProperties: true
    required: [event, data]

  - type: object
    properties:
      event:
        type: string
        enum: [paymentrequest.pending, paymentrequest.success]
      data:
        type: object
        description: Payment request lifecycle details.
        additionalProperties: true
    required: [event, data]

  - type: object
    properties:
      event:
        type: string
        enum: [subscription.expiring_cards]
      data:
        type: object
        description: Subscription and card expiry information for the affected customer.
        additionalProperties: true
    required: [event, data]

  - type: object
    properties:
      event:
        type: string
        enum: [direct_debit.authorization.created, direct_debit.authorization.active]
      data:
        type: object
        description: Direct Debit authorization and mandate status details.
        additionalProperties: true
    required: [event, data]

  - type: object
    properties:
      event:
        type: string
        enum: [zero_charge_authorization.success]
      data:
        type: object
        description: Zero-charge card authorization result.
        additionalProperties: true
    required: [event, data]

  - type: object
    properties:
      event:
        type: string
        enum: [dedicatedaccount.assign.success]
      data:
        $ref: "./DedicatedNubanFetchResponse.yaml#/properties/data"
    required: [event, data]

  - type: object
    properties:
      event:
        type: string
        enum: [dedicatedaccount.assign.failed]
      data:
        $ref: "./DedicatedNubanFetchResponse.yaml#/properties/data"
    required: [event, data]

  - type: object
    properties:
      event:
        type: string
        enum: [refund.processed]
      data:
        $ref: "./RefundFetchResponse.yaml#/properties/data"
    required: [event, data]

  - type: object
    properties:
      event:
        type: string
        enum: [refund.failed]
      data:
        $ref: "./RefundFetchResponse.yaml#/properties/data"
    required: [event, data]

  - type: object
    properties:
      event:
        type: string
        enum: [charge.dispute.create]
      data:
        $ref: "./DisputeFetchResponse.yaml#/properties/data"
    required: [event, data]

  - type: object
    properties:
      event:
        type: string
        enum: [charge.dispute.resolve]
      data:
        $ref: "./DisputeFetchResponse.yaml#/properties/data"
    required: [event, data]

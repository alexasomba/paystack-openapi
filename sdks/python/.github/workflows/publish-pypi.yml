name: Publish Python SDK
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string
      publish:
        description: Publish the validated distributions to PyPI
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: python-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check package version against release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          assert os.environ["RELEASE_TAG"] == f"v{version}", "Release tag and package version differ"
          PY
      - name: Install and verify
        run: |
          python -m pip install -r requirements.txt -r test-requirements.txt
          python -m pytest
          python -m mypy --follow-imports=skip --disable-error-code=misc alexasomba_paystack/extras.py test/test_contract.py
          python -m ruff check alexasomba_paystack/extras.py test/test_contract.py
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
